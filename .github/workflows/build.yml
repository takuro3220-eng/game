name: Build Godot ZIP — iPhone web preview

on:
  push:
    branches: [main]
    paths:
      - ASTRA_LEGENDS_V10_SOURCE.zip
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: astra-godot-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack uploaded Godot project
        shell: bash
        run: |
          test -s ASTRA_LEGENDS_V10_SOURCE.zip
          unzip -t ASTRA_LEGENDS_V10_SOURCE.zip
          mkdir -p game
          unzip -q ASTRA_LEGENDS_V10_SOURCE.zip -d game
          test -s game/project.godot
          test -s game/scenes/main.tscn
          test -s game/assets/models/characters/aster.glb
          test -s game/assets/models/characters/lyra.glb
          test -s game/export_presets.cfg
          python3 - <<'PY'
          from pathlib import Path
          root=Path("game")
          needed=["scripts/game_root.gd","scripts/player.gd","scripts/enemy.gd","scripts/touch_hud.gd","scripts/world_builder.gd","assets/audio/celestial_theme.ogg"]
          assert all((root/n).is_file() for n in needed), "Missing Godot gameplay resources"
          print("Godot project and playable resources present")
          PY

      - name: Install Godot engine and Web export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Import GLB models, scenes, and textures
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game --editor --quit 2>&1 | tee godot_import.log
          if grep -iE 'SCRIPT ERROR|Parse Error|Parser Error' godot_import.log; then exit 1; fi

      - name: Run Godot engine startup smoke test
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game --quit-after 45 2>&1 | tee godot_smoke.log
          if grep -iE 'SCRIPT ERROR|Parse Error|Parser Error' godot_smoke.log; then exit 1; fi

      - name: Export iPhone-compatible Web build
        shell: bash
        run: |
          EXPORT_DEST="$GITHUB_WORKSPACE/game/build/web/index.html"
          mkdir -p "$(dirname "$EXPORT_DEST")"
          godot --headless --path "$GITHUB_WORKSPACE/game" --export-release "Web" "$EXPORT_DEST"
          test -s "$GITHUB_WORKSPACE/game/build/web/index.html"
          test -s "$GITHUB_WORKSPACE/game/build/web/index.wasm"
          test -s "$GITHUB_WORKSPACE/game/build/web/index.pck"

      - name: Save build artifact for inspection
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-LEGENDS-Godot-Web
          path: game/build/web/
          if-no-files-found: error

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: game/build/web/

      - name: Publish game to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
